name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy networkx python-dotenv qdrant-client langgraph \
                      langchain-core langchain-google-genai pytest

      - name: Run tests (offline backends, no model downloads)
        env:
          KB_OFFLINE: "1"
        run: pytest tests/ -v
